hardware_profile: cloud_gpu

device: auto        # resolved at runtime by src/utils/hardware.py -- never hardcode "cuda"
precision: auto      # auto -> bf16 if an Ampere-or-newer GPU is detected, else fp32.
                      # fp16 is intentionally never auto-selected: mT5 was pretrained in
                      # bf16 and is documented to produce NaN losses under fp16 mixed
                      # precision. Set precision explicitly here only if you accept that risk.

batch_size: 8
gradient_accumulation_steps: 4   # effective batch size 32
